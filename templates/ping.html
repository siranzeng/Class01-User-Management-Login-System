{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2 class="card-title">Ping 网络诊断</h2>
    <form method="post" action="/ping" class="ping-form">
        <div class="form-group">
            <label for="ip">IP地址或域名：</label>
            <input type="text" name="ip" id="ip" class="form-input" placeholder="例如：127.0.0.1 或 baidu.com" value="{{ ip }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Ping</button>
    </form>
</div>

{% if result %}
<div class="card">
    <h3 class="card-subtitle">执行结果</h3>
    <div class="console-output">{{ result }}</div>
</div>
{% endif %}
{% endblock %}
